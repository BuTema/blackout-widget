name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels the build still running for an older one, so an old build can never finish later
# and replace the newer "Latest build" release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest
        continue-on-error: true

      - name: Build APKs (small release build and a plain debug one)
        run: ./gradlew assembleGithubRelease assembleGithubDebug

      # The Google Play bundle is signed with the upload key from the repository secrets
      # (UPLOAD_KEYSTORE_B64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD).
      # Without them this step does nothing; the sideload APKs above never use that key.
      - name: Build the Google Play bundle (.aab)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then
            echo "No upload key in the secrets; skipping the bundle."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew bundlePlayRelease
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload the Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: blackout-widget-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: ignore

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackout-widget-apk
          path: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error

      - name: Publish the APK as the "Latest build" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/github/release/*.apk blackout-widget.apk
          cp app/build/outputs/apk/github/debug/*.apk blackout-widget-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest blackout-widget.apk blackout-widget-debug.apk --title "Latest build" --prerelease \
            --notes "Automatic build of ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER}). blackout-widget.apk is the small one; blackout-widget-debug.apk is the same app without shrinking, in case something misbehaves."
